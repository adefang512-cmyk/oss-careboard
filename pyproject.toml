[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-careboard"
version = "0.2.0"
description = "Generate an actionable maintenance dashboard for any public GitHub repository."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "OSS Careboard contributors" }
]
keywords = ["github", "open-source", "maintenance", "triage", "dashboard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/adefang512-cmyk/oss-careboard"
Issues = "https://github.com/adefang512-cmyk/oss-careboard/issues"

[project.scripts]
oss-careboard = "oss_careboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
