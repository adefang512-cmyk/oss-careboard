name: OSS Careboard
description: Generate a zero-cost, actionable maintenance briefing for a GitHub repository.
author: OSS Careboard contributors

branding:
  icon: activity
  color: blue

inputs:
  repository:
    description: Repository in owner/name format. Defaults to the current repository.
    required: false
    default: ""
  token:
    description: GitHub token used to read repository metadata.
    required: true
  stale-days:
    description: Days without an update before an issue or pull request needs attention.
    required: false
    default: "30"
  limit:
    description: Maximum number of work items shown in each attention queue.
    required: false
    default: "10"
  max-pages:
    description: Maximum GitHub API pages fetched per attention queue.
    required: false
    default: "10"
  language:
    description: Report language, either en or zh.
    required: false
    default: en
  include-labels:
    description: Comma-separated labels; attention items must match at least one.
    required: false
    default: ""
  exclude-labels:
    description: Comma-separated labels to remove from attention queues.
    required: false
    default: ""
  output:
    description: Markdown report path.
    required: false
    default: CAREBOARD.md
  summary-output:
    description: Optional machine-readable summary JSON path.
    required: false
    default: ""

outputs:
  report:
    description: Path to the generated Markdown report.
    value: ${{ steps.generate.outputs.report }}
  summary:
    description: Path to the generated machine-readable summary, when requested.
    value: ${{ steps.generate.outputs.summary }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install OSS Careboard
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Generate maintenance dashboard
      id: generate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_STALE_DAYS: ${{ inputs['stale-days'] }}
        INPUT_LIMIT: ${{ inputs.limit }}
        INPUT_MAX_PAGES: ${{ inputs['max-pages'] }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_INCLUDE_LABELS: ${{ inputs['include-labels'] }}
        INPUT_EXCLUDE_LABELS: ${{ inputs['exclude-labels'] }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_SUMMARY_OUTPUT: ${{ inputs['summary-output'] }}
      run: |
        repository="${INPUT_REPOSITORY:-$GITHUB_REPOSITORY}"
        args=(
          --repo "$repository"
          --stale-days "$INPUT_STALE_DAYS"
          --limit "$INPUT_LIMIT"
          --max-pages "$INPUT_MAX_PAGES"
          --language "$INPUT_LANGUAGE"
          --output "$INPUT_OUTPUT"
        )
        IFS=',' read -ra include_labels <<< "$INPUT_INCLUDE_LABELS"
        for label in "${include_labels[@]}"; do
          [[ -n "$label" ]] && args+=(--include-label "$label")
        done
        IFS=',' read -ra exclude_labels <<< "$INPUT_EXCLUDE_LABELS"
        for label in "${exclude_labels[@]}"; do
          [[ -n "$label" ]] && args+=(--exclude-label "$label")
        done
        if [[ -n "$INPUT_SUMMARY_OUTPUT" ]]; then
          args+=(--summary-json "$INPUT_SUMMARY_OUTPUT")
        fi
        oss-careboard "${args[@]}"
        cat "$INPUT_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
        echo "report=$INPUT_OUTPUT" >> "$GITHUB_OUTPUT"
        echo "summary=$INPUT_SUMMARY_OUTPUT" >> "$GITHUB_OUTPUT"
